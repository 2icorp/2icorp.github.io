<!doctype html>
<html lang="ko">
<head>
<script>(function(){try{var t=localStorage.getItem("theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹 존재감 진단 데모 · 2i</title>
<link rel="stylesheet" href="../../styles.css?v=18">
<style>
  .demo-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,2vw,2rem);border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
  .demo-brand{display:flex;align-items:baseline;gap:.6rem;text-decoration:none;color:var(--ink);}
  .demo-brand__mark{font-family:var(--mono);font-weight:800;color:var(--signal);font-size:1.1rem;}
  .demo-brand__tag{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;}
  .demo-top__links{display:flex;gap:1.2rem;font-size:var(--text-sm);}
  .demo-top__links a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease);}
  .demo-top__links a:hover{color:var(--ink);border-color:var(--line);}
  .demo-top__links a:focus-visible{outline:2px solid var(--signal);outline-offset:3px;}
  .demo-banner{font-family:var(--mono);font-size:var(--text-xs);color:var(--ink-faint);background:var(--paper-2);border-bottom:1px solid var(--line-soft);padding:.55rem clamp(1rem,2vw,2rem);letter-spacing:.01em;}
  main{max-width:1080px;margin:0 auto;padding:2rem clamp(1rem,2vw,2rem) 1rem;}
  h1{font-size:var(--text-h2);margin:0 0 .4rem;}
  .lede{color:var(--ink-soft);max-width:64ch;margin:0 0 1.8rem;line-height:1.7;}
  .presets{display:flex;gap:.7rem;margin-bottom:1.4rem;flex-wrap:wrap;}
  .presetbtn{font-family:var(--mono);font-size:var(--text-xs);padding:.55rem 1rem;border-radius:var(--radius);border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease);}
  .presetbtn:hover{border-color:var(--signal);transform:translateY(-1px);}
  .presetbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  .presetbtn--bad{color:var(--signal-deep);}
  .presetbtn--good{color:var(--steel);}
  .layout{display:grid;grid-template-columns:1.1fr 1fr;gap:1.4rem;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);}
  .form{padding:1.4rem clamp(1rem,2vw,1.6rem);display:grid;gap:1rem;}
  .field{display:grid;gap:.4rem;}
  .field label{font-family:var(--mono);font-size:var(--text-xs);color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
  .field .count{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-faint);}
  .field input, .field textarea{
    font-family:var(--sans);font-size:.95rem;color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:var(--radius);padding:.65rem .8rem;resize:vertical;
    transition:border-color var(--dur) var(--ease);
  }
  .field input:focus-visible, .field textarea:focus-visible{outline:2px solid var(--signal);outline-offset:1px;border-color:var(--signal);}
  .field textarea.desc{min-height:4.2rem;}
  .field textarea.body{min-height:9rem;}
  .runbtn{font-family:var(--mono);font-size:.92rem;font-weight:700;padding:.8rem 1.2rem;border-radius:var(--radius);border:none;background:var(--signal);color:oklch(22% 0.03 60);cursor:pointer;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
  .runbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow, 0 4px 12px rgba(0,0,0,.15));}
  .runbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .result{padding:1.4rem clamp(1rem,2vw,1.6rem);}
  .gauge-wrap{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.2rem;}
  .gauge-num{font-size:1.9rem;font-weight:800;}
  .gauge-label{font-family:var(--mono);font-size:var(--text-xs);color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;}
  .checklist{display:grid;gap:.55rem;}
  .citem{display:flex;align-items:flex-start;gap:.7rem;padding:.7rem .8rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}
  .cbadge{flex:none;font-family:var(--mono);font-size:var(--text-xs);font-weight:800;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line);white-space:nowrap;margin-top:.05rem;}
  .cbadge.pass{color:var(--steel);border-color:var(--steel-soft);background:color-mix(in srgb, var(--steel) 12%, transparent);}
  .cbadge.warn{color:var(--signal-deep);border-color:var(--signal);background:color-mix(in srgb, var(--signal) 14%, transparent);}
  .cbadge.fail{color:var(--ink);border-color:var(--ink-faint);background:color-mix(in srgb, var(--ink) 10%, transparent);}
  .citem__body{display:grid;gap:.15rem;}
  .citem__title{font-weight:700;font-size:.9rem;}
  .citem__msg{font-size:.84rem;color:var(--ink-soft);line-height:1.6;}
  .empty-note{color:var(--ink-faint);font-size:var(--text-sm);line-height:1.7;}
  .demo-foot{margin-top:3rem;padding:1.6rem clamp(1rem,2vw,2rem) 2.4rem;font-family:var(--mono);font-size:var(--text-xs);color:var(--ink-faint);border-top:1px solid var(--line-soft);text-align:center;}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<header class="demo-top">
  <a href="/" class="demo-brand"><span class="demo-brand__mark">2i</span><span class="demo-brand__tag">DEMO · 웹 존재감 진단</span></a>
  <nav class="demo-top__links">
    <a href="/cases.html#case-10">사례 보기</a>
  </nav>
</header>
<div class="demo-banner">브라우저에서 그 자리에서 계산하는 인터랙티브 데모입니다. 합성 데이터를 씁니다.</div>

<main>
  <h1>웹 존재감 진단</h1>
  <p class="lede">회사명과 페이지 제목, 메타 설명, 본문을 넣으면 검색 노출에 영향을 주는 8가지 항목을 규칙 기반으로 즉시 채점합니다. 직접 값을 바꾸며 점수가 어떻게 움직이는지 확인해보세요.</p>

  <div class="presets">
    <button class="presetbtn presetbtn--bad" id="badPreset">나쁜 예 보기</button>
    <button class="presetbtn presetbtn--good" id="goodPreset">좋은 예 보기</button>
  </div>

  <div class="layout">
    <div class="card form">
      <div class="field">
        <label for="companyName">회사명</label>
        <input type="text" id="companyName" placeholder="예: 센트럴목재">
      </div>
      <div class="field">
        <label for="pageTitle">페이지 제목 <span class="count" id="titleCount">0자</span></label>
        <input type="text" id="pageTitle" placeholder="예: 센트럴목재, 국산 원목 가구 전문 제작업체">
      </div>
      <div class="field">
        <label for="metaDesc">메타 설명 <span class="count" id="descCount">0자</span></label>
        <textarea id="metaDesc" class="desc" placeholder="검색 결과에 노출될 요약 문장을 적어보세요."></textarea>
      </div>
      <div class="field">
        <label for="bodyText">본문 텍스트 <span class="count" id="bodyCount">0자</span></label>
        <textarea id="bodyText" class="body" placeholder="실제 페이지 본문을 붙여넣어 보세요. 문단은 빈 줄로 구분합니다."></textarea>
      </div>
      <button class="runbtn" id="runBtn">진단하기</button>
    </div>

    <div class="card result">
      <div class="gauge-wrap">
        <svg id="gauge" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="종합 점수 게이지"></svg>
        <div>
          <div class="gauge-num" id="gaugeNum">-</div>
          <div class="gauge-label">종합 점수 (100점 만점)</div>
        </div>
      </div>
      <div class="checklist" id="checklist">
        <div class="empty-note">왼쪽 폼을 채우고 진단하기를 누르면, 8개 항목의 통과·경고·실패 결과와 개선 문구가 여기 표시됩니다.</div>
      </div>
    </div>
  </div>
</main>

<footer class="demo-foot">© 2i · contact@2icorp.site</footer>

<script>
(function(){
  "use strict";

  var companyInput = document.getElementById("companyName");
  var titleInput = document.getElementById("pageTitle");
  var descInput = document.getElementById("metaDesc");
  var bodyInput = document.getElementById("bodyText");
  var titleCount = document.getElementById("titleCount");
  var descCount = document.getElementById("descCount");
  var bodyCount = document.getElementById("bodyCount");
  var checklistEl = document.getElementById("checklist");
  var gaugeNum = document.getElementById("gaugeNum");
  var gaugeSvg = document.getElementById("gauge");

  function updateCounts(){
    titleCount.textContent = titleInput.value.trim().length + "자";
    descCount.textContent = descInput.value.trim().length + "자";
    bodyCount.textContent = bodyInput.value.trim().length + "자";
  }
  [titleInput, descInput, bodyInput].forEach(function(el){ el.addEventListener("input", updateCounts); });
  updateCounts();

  function includesCompany(text, company){
    if(!company) return false;
    return text.toLowerCase().indexOf(company.toLowerCase()) !== -1;
  }
  function countOccurrences(text, sub){
    if(!sub) return 0;
    var lower = text.toLowerCase(), s = sub.toLowerCase();
    if(s.length === 0) return 0;
    var count = 0, idx = 0;
    while(true){
      idx = lower.indexOf(s, idx);
      if(idx === -1) break;
      count++; idx += s.length;
    }
    return count;
  }
  function countParagraphs(body){
    return body.split(/\n\s*\n/).map(function(p){ return p.trim(); }).filter(function(p){ return p.length > 0; }).length;
  }
  function hasSpammyPunctuation(title){
    return /[!?]{2,}|[★☆❤]/.test(title);
  }

  function evaluate(){
    var company = companyInput.value.trim();
    var title = titleInput.value.trim();
    var desc = descInput.value.trim();
    var body = bodyInput.value.trim();

    var items = [];

    // 1. 제목 길이
    var tLen = title.length;
    items.push(scoreTri("제목 길이 (15~60자 권장)", tLen,
      function(v){ return v >= 15 && v <= 60; },
      function(v){ return v >= 8 && v < 70 && v > 0; },
      tLen + "자입니다. ",
      "검색 결과에서 제목이 잘리지 않으려면 15자에서 60자 사이로 맞춰주세요.",
      "범위에 가깝지만 조금 더 다듬으면 좋습니다."
    ));

    // 2. 설명 길이
    var dLen = desc.length;
    items.push(scoreTri("메타 설명 길이 (70~160자 권장)", dLen,
      function(v){ return v >= 70 && v <= 160; },
      function(v){ return (v >= 40 && v < 70) || (v > 160 && v <= 200); },
      dLen + "자입니다. ",
      "검색 결과 미리보기에 자연스럽게 노출되려면 70자에서 160자 사이가 좋습니다.",
      "범위에 가깝지만 조금 더 조정하면 좋습니다."
    ));

    // 3. 본문 글자수
    var bLen = body.length;
    items.push(scoreTri("본문 글자수 (300자 이상 권장)", bLen,
      function(v){ return v >= 300; },
      function(v){ return v >= 100 && v < 300; },
      bLen + "자입니다. ",
      "본문이 너무 짧으면 검색 엔진이 페이지 주제를 판단하기 어렵습니다. 300자 이상을 권장합니다.",
      "조금만 더 보강하면 300자 기준을 넘길 수 있습니다."
    ));

    // 4. 제목에 회사명 포함
    var titleHasCompany = includesCompany(title, company);
    items.push({
      title: "제목에 회사명 포함",
      status: titleHasCompany ? "pass" : "fail",
      msg: titleHasCompany ? "제목에 회사명이 포함되어 있습니다." : "제목에 회사명이 보이지 않습니다. 검색 노출과 브랜드 인지에 불리하니 넣어주세요."
    });

    // 5. 설명에 회사명 포함
    var descHasCompany = includesCompany(desc, company);
    items.push({
      title: "메타 설명에 회사명 포함",
      status: descHasCompany ? "pass" : "fail",
      msg: descHasCompany ? "메타 설명에 회사명이 포함되어 있습니다." : "메타 설명에도 회사명을 한 번은 넣어주는 것이 좋습니다."
    });

    // 6. 본문에 회사명 2회 이상
    var bodyCompanyCount = countOccurrences(body, company);
    items.push(scoreTri("본문 내 회사명 언급 (2회 이상 권장)", bodyCompanyCount,
      function(v){ return v >= 2; },
      function(v){ return v === 1; },
      bodyCompanyCount + "회 언급되었습니다. ",
      "본문에서 회사명이 전혀 언급되지 않았습니다. 최소 2회는 자연스럽게 넣어주세요.",
      "한 번은 언급됐지만 한 번 더 넣으면 더 좋습니다."
    ));

    // 7. 문단 수
    var paraCount = countParagraphs(body);
    items.push(scoreTri("문단 구성 (3개 이상 권장)", paraCount,
      function(v){ return v >= 3; },
      function(v){ return v === 2; },
      paraCount + "개 문단으로 나뉘어 있습니다. ",
      "본문이 한 덩어리로 되어 있으면 읽기 어렵습니다. 빈 줄로 문단을 3개 이상 나눠주세요.",
      "문단이 조금 더 있으면 가독성이 좋아집니다."
    ));

    // 8. 제목 스팸 기호
    var spammy = hasSpammyPunctuation(title);
    items.push({
      title: "제목에 과도한 특수문자 없음",
      status: (!spammy && title.length>0) ? "pass" : (title.length===0 ? "fail" : "fail"),
      msg: (!spammy && title.length>0) ? "제목에 불필요한 특수문자나 이모지가 없습니다." : "느낌표 반복이나 이모지처럼 스팸으로 보일 수 있는 기호는 빼는 것이 좋습니다."
    });

    var score = items.reduce(function(sum, it){
      return sum + (it.status === "pass" ? 12.5 : it.status === "warn" ? 6.25 : 0);
    }, 0);

    renderChecklist(items);
    renderGauge(score);
  }

  function scoreTri(titleText, value, passFn, warnFn, prefix, failMsg, warnMsg){
    var status = passFn(value) ? "pass" : (warnFn(value) ? "warn" : "fail");
    var msg = status === "pass" ? (prefix + "적정 범위입니다.") : status === "warn" ? (prefix + warnMsg) : (prefix + failMsg);
    return { title: titleText, status: status, msg: msg };
  }

  var STATUS_LABEL = { pass:"통과", warn:"경고", fail:"실패" };

  function renderChecklist(items){
    checklistEl.innerHTML = "";
    items.forEach(function(it){
      var row = document.createElement("div");
      row.className = "citem";
      row.innerHTML =
        '<span class="cbadge ' + it.status + '">' + STATUS_LABEL[it.status] + '</span>' +
        '<div class="citem__body">' +
          '<div class="citem__title">' + it.title + '</div>' +
          '<div class="citem__msg">' + it.msg + '</div>' +
        '</div>';
      checklistEl.appendChild(row);
    });
  }

  function renderGauge(score){
    var r = 54, cx = 70, cy = 70;
    var circumference = 2 * Math.PI * r;
    var offset = circumference * (1 - score/100);
    var color = score >= 75 ? "var(--steel)" : score >= 45 ? "var(--signal)" : "var(--signal-deep)";
    gaugeSvg.innerHTML =
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="12"></circle>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="12" ' +
        'stroke-linecap="round" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '" ' +
        'transform="rotate(-90 ' + cx + ' ' + cy + ')" style="transition:stroke-dashoffset .5s var(--ease, ease-out);"></circle>';
    gaugeNum.textContent = Math.round(score) + "점";
  }

  document.getElementById("runBtn").addEventListener("click", evaluate);

  document.getElementById("badPreset").addEventListener("click", function(){
    companyInput.value = "센트럴목재";
    titleInput.value = "환영합니다!!!";
    descInput.value = "저희 홈페이지입니다.";
    bodyInput.value = "안녕하세요. 좋은 제품 많습니다. 연락주세요!!!";
    updateCounts();
    evaluate();
  });

  document.getElementById("goodPreset").addEventListener("click", function(){
    companyInput.value = "센트럴목재";
    titleInput.value = "센트럴목재, 국산 원목 가구 전문 제작업체";
    descInput.value = "센트럴목재는 1994년부터 합판이 아닌 국산 통원목만을 사용해 온 가구 제작업체입니다. 맞춤 치수 상담부터 제작, 시공, 사후 관리까지 전 과정을 자체 공방에서 직접 진행합니다.";
    bodyInput.value =
      "센트럴목재는 1994년부터 원목 가구를 만들어온 제작업체입니다. 합판이나 집성목이 아닌 통원목만을 고집하며, 모든 공정을 자체 공방에서 진행합니다.\n\n" +
      "고객이 원하는 크기와 색상에 맞춰 맞춤 제작을 진행하고, 설치 이후에도 애프터서비스를 제공합니다. 최근에는 친환경 마감재로 전환해 실내 공기질까지 신경 쓰고 있습니다.\n\n" +
      "센트럴목재의 모든 제품은 3년 무상 보증이 적용되며, 방문 상담을 통해 실제 원목 샘플을 확인하실 수 있습니다.";
    updateCounts();
    evaluate();
  });
})();
</script>
</body>
</html>
